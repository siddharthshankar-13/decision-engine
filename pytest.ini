[pytest]
addopts = -p no:cacheprovider --cov=graph --cov=simulation --cov=scenarios --cov=sensitivity --cov=critique --cov=critique_adapters --cov=critique_aggregation --cov=report --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
testpaths = .
python_files = test_*.py
norecursedirs = .git .venv __pycache__ .pytest_cache pytest-cache-files-*
