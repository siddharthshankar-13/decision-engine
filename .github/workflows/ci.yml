name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile modules
        run: >-
          python -m py_compile graph.py simulation.py scenarios.py sensitivity.py
          critique.py critique_adapters.py critique_aggregation.py report.py
      - name: Run tests
        run: python -m pytest -q
